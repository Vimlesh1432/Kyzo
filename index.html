<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="logo.png" alt="Spotify">Spotify</li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>

    <div class="container">
        <div class="songlist">
            <h1>Best of NCS - No Copyright Sounds</h1>
            <div class="songitemcontainer">
                <div class="songItem">
                    <img src="cover.jpg" alt="1" width="100px">
                    <span class="songName">A</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i class="far fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1" width="100px">
                    <span class="songName">B</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i class="far fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1" width="100px">
                    <span class="songName">C</span>
                    <span class="songlistplay"><span class="timestamp">03:40 <i class="far fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1" width="100px">
                    <span class="songName">D</span>
                    <span class="songlistplay"><span class="timestamp">04:30 <i class="far fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1" width="100px">
                    <span class="songName">E</span>
                    <span class="songlistplay"><span class="timestamp">06:04 <i class="far fa-play-circle"></i></span></span>
                </div>

                <div class="songItem">
                    <img src="cover.jpg" alt="1" width="100px">
                    <span class="songName">F</span>
                    <span class="songlistplay"><span class="timestamp">04:34 <i class="far fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1" width="100px">
                    <span class="songName">G</span>
                    <span class="songlistplay"><span class="timestamp">02:04 <i class="far fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1" width="100px">
                    <span class="songName">H</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i class="far fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1" width="100px">
                    <span class="songName">I</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i class="far fa-play-circle"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="cover.jpg" alt="1" width="100px">
                    <span class="songName">J</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i class="far fa-play-circle"></i></span></span>
                </div>
            </div>
        </div>
        <div class="songbar"></div>
    </div>

    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
        <div class="icons">
            <!-- fontawesome icons -->
            <i class="fas fa-3x fa-step-backward"></i>
            <i class="far fa-3x fa-play-circle" id="masterplay"></i>
            <i class="fas fa-3x fa-step-forward"></i>
        </div>
        <div class="songInfo">
             <img src="gif1.jpg" width="42px" alt="" id="gif"> Let me Love You - Vimlesh Yadav
        </div>
    </div>
    <script src="https://kit.fontawesome.com/79c3667dd3.js" crossorigin="anonymous"></script>
    
    <script src="script.js"></script>
</body>
</html>
